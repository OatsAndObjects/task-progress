<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Task Progress v2</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Main">
    <div class="logo"><b>&#10022;</b></div>
    <button class="navb" data-nav="cubes"><span data-ic="cube"></span>Cubes</button>
    <button class="navb" data-nav="usage"><span data-ic="gauge"></span>Usage</button>
  </nav>
  <div class="main">
    <header class="top">
      <div class="sess"><b id="sess-name">Session</b><span class="mono" id="sess-cwd"></span></div>
      <span class="chip blue hidem" id="model-chip" hidden></span>
      <span class="chip" id="status"><i class="pulse"></i><span id="status-text">Connecting</span></span>
      <div class="meters" id="meters" hidden>
        <div class="mm" id="mm-ctx" hidden><span></span><i><u></u></i></div>
        <div class="mm" id="mm-5h" hidden><span></span><i><u></u></i></div>
        <div class="mm" id="mm-week" hidden><span></span><i><u></u></i></div>
      </div>
      <button class="btn sm hidem" data-act="palette"><span data-ic="search"></span>Search <kbd>Ctrl K</kbd></button>
    </header>
    <div class="banner" id="banner" role="alert"></div>
    <div class="screens">
      <section class="screen" id="screen-cubes" hidden><div class="empty"><div class="card"><h2>No cubes planned</h2><p>When Claude plans work in cubes, you will approve them here.</p></div></div></section>
      <section class="screen" id="screen-usage" hidden><div class="empty"><div class="card"><h2>No usage data yet</h2><p>Context, 5-hour and weekly limits will be shown here.</p></div></div></section>
    </div>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<div class="toast" id="toast" role="status"></div>
<script src="core.js"></script>
<script src="demo.js"></script>
<script src="cubes.js"></script>
<script src="usage.js"></script>
<script>TP.boot();</script>
</body>
</html>
